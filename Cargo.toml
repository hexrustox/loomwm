[package]
name = "loomwm"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"
members = ["assistant"]

[dependencies]
anyhow = "1.0.100"
bitflags = { version = "2.10.0", features = ["serde", "std"] }
evdev = "0.13.2"
notify = "8.2.0"
regex = "1.12.3"
serde.workspace = true
slotmap = "1.1.1"
smithay = { version = "0.7.0", default-features = false, features = [
  "backend_winit",
  "wayland_frontend",
  "desktop",
  "renderer_gl",
] }
toml = "0.9.11"
xkbcommon = "0.9.0"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }

[dev-dependencies]
proptest = "1.9.0"
test-case = "3.3.1"
