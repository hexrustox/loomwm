include:
  - ./override/compose.yml
services:
  dev:
    build: .
    container_name: $CONTAINER_NAME
    volumes:
      - ${PWD}:${PWD}
      - nix-dir:/nix
      - dot-cache:/root/.cache
      - dot-cargo:/root/.cargo
    working_dir: ${PWD}
    stdin_open: true
    tty: true
    environment:
      - NIX_CONFIG=experimental-features = nix-command flakes
      - TERM=xterm-256color
      - COLORTERM=truecolor
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 4gb

volumes:
  nix-dir:
    external: true
  dot-cache:
    external: true
  dot-cargo:
    external: true
